name: Build iOS 9 ARMv7 IPA for iPad Mini 1

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 11 / iOS 9 Legacy Target
        run: |
          sudo xcode-select -s /Applications/Xcode_14.2.app || true

      - name: Setup Theos & SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          mkdir -p ~/theos/sdks
          curl -L "https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS9.3.sdk.tar.xz" -o /tmp/sdk.tar.xz
          tar -xf /tmp/sdk.tar.xz -C ~/theos/sdks/

      - name: Compile and Package CineStream IPA
        run: |
          export THEOS=$HOME/theos
          export SDKVERSION=9.3
          export TARGET=iphone:clang:9.3:9.0
          export ARCHS=armv7
          
          cd ios-app
          
          mkdir -p Payload/CineStream.app/www
          cp ../index.html ../styles.css ../app.js Payload/CineStream.app/www/ 2>/dev/null || true
          cp Info.plist Payload/CineStream.app/Info.plist
          
          # Use macOS native clang targeting ARMv7 iOS 9.0
          xcrun -sdk $THEOS/sdks/iPhoneOS9.3.sdk clang \
            -arch armv7 \
            -miphoneos-version-min=9.0 \
            -isysroot $THEOS/sdks/iPhoneOS9.3.sdk \
            -fobjc-arc \
            -framework UIKit \
            -framework WebKit \
            -framework CoreGraphics \
            -framework Foundation \
            main.m \
            -o Payload/CineStream.app/CineStream
            
          # Sign binary with ldid
          ~/theos/bin/ldid -Sentitlements.plist Payload/CineStream.app/CineStream || ldid -Sentitlements.plist Payload/CineStream.app/CineStream || true
          file Payload/CineStream.app/CineStream
          zip -r CineStream-iOS9-iPadMini1.ipa Payload

      - name: Upload CineStream IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CineStream-iOS9-iPadMini1
          path: ios-app/CineStream-iOS9-iPadMini1.ipa
